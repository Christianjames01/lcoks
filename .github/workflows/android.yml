name: Android APK

# Builds the VaultLocks Android app on every push to main and publishes the APK
# on the repository's Releases page (https://github.com/<owner>/<repo>/releases/latest).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Security & unit tests
        run: npm test

      - name: Build mobile web bundle and sync Capacitor
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.VAULTLOCKS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "VAULTLOCKS_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "::warning::VAULTLOCKS_KEYSTORE_BASE64 secret not set - signing with a temporary debug key."
            echo "SIGNED_WITH=temporary debug key (add the signing secrets for stable updates)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        env:
          VAULTLOCKS_KEYSTORE_PASSWORD: ${{ secrets.VAULTLOCKS_KEYSTORE_PASSWORD }}
          VAULTLOCKS_KEY_ALIAS: ${{ secrets.VAULTLOCKS_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PversionName=$VERSION

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "VaultLocks-$VERSION.apk"
          sha256sum "VaultLocks-$VERSION.apk" > SHA256SUMS.txt
          rm -f "$RUNNER_TEMP/release.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: VaultLocks-${{ env.VERSION }}
          path: |
            VaultLocks-*.apk
            SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          **VaultLocks for Android $VERSION** — offline encrypted password vault.

          ### Install
          1. On your phone, download **VaultLocks-$VERSION.apk** below.
          2. Open it and allow "Install unknown apps" for your browser/files app when Android asks.
          3. Open VaultLocks and create your master password.

          Your vault never leaves the phone. Make encrypted backups from **Settings → Vault & Backup**;
          backups are compatible with the VaultLocks desktop app.

          Signed with: $SIGNED_WITH
          Commit: ${{ github.sha }}

          SHA-256: \`$(cut -d' ' -f1 SHA256SUMS.txt)\`
          NOTES
          gh release create "v$VERSION" "VaultLocks-$VERSION.apk" SHA256SUMS.txt \
            --title "VaultLocks $VERSION (Android)" --notes-file notes.md --latest
